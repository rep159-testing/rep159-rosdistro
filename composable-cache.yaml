distribution_file:
- binary_rule:
    replace: vendor-{DISTRO}-
    search: ^
  install_rule: /opt/ros/{distro}
  release_platforms:
    ubuntu:
    - resolute
  repositories:
    ros_workspace: {release: {tags: {release: 'release/upstream/{package}/{version}'}, url: 'https://github.com/rep159-testing/ros_workspace-release.git', version: 1.0.4-1}, source: {type: git, url: 'https://github.com/rep159-testing/ros_workspace.git', version: main}}
    upstream_a: {release: {tags: {release: 'release/upstream/{package}/{version}'}, url: 'https://github.com/rep159-testing/upstream_a-release.git', version: 0.1.0-1}, source: {type: git, url: 'https://github.com/rep159-testing/upstream_a.git', version: main}}
    upstream_b: {release: {tags: {release: 'release/upstream/{package}/{version}'}, url: 'https://github.com/rep159-testing/upstream_b-release.git', version: 0.1.0-1}, source: {type: git, url: 'https://github.com/rep159-testing/upstream_b.git', version: main}}
    upstream_c: {release: {tags: {release: 'release/upstream/{package}/{version}'}, url: 'https://github.com/rep159-testing/upstream_c-release.git', version: 0.1.0-1}, source: {type: git, url: 'https://github.com/rep159-testing/upstream_c.git', version: main}}
  type: distribution
  version: 3
name: composable
release_package_xmls:
  ros_workspace: <?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format2.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="3"><name>ros_workspace</name><version>1.0.4</version><description>Provides the prefix level environment files for ROS 2 packages.</description><maintainer email="michael.jeronimo@openrobotics.org">Michael Jeronimo</maintainer><license file="LICENSE">Apache License 2.0</license><author email="steven@openrobotics.org">Steven! Ragnarök</author><build_depend>ament_cmake_core</build_depend><build_depend>ament_package</build_depend><buildtool_depend>cmake</buildtool_depend><export><build_type>cmake</build_type></export></package>
  upstream_a: '<?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format3.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="3"><name>upstream_a</name><version>0.1.0</version><description>Bottom of the REP-159 test chain: counts the elements of an XML document with libxml2. Part of the upstream distribution of the rep159-testing harness.</description><maintainer email="jrivero@honurobotics.com">Jose Luis Rivero</maintainer><license>Apache-2.0</license><buildtool_depend>cmake</buildtool_depend><depend>libxml2</depend><build_depend>gtest</build_depend><test_depend>gtest</test_depend><export><build_type>cmake</build_type></export></package>'
  upstream_b: '<?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format3.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="3"><name>upstream_b</name><version>0.1.0</version><description>Middle of the REP-159 test chain: summarizes an XML document through upstream_a. Part of the upstream distribution of the rep159-testing harness.</description><maintainer email="jrivero@honurobotics.com">Jose Luis Rivero</maintainer><license>Apache-2.0</license><buildtool_depend>cmake</buildtool_depend><depend>upstream_a</depend><build_depend>gtest</build_depend><test_depend>gtest</test_depend><export><build_type>cmake</build_type></export></package>'
  upstream_c: '<?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format3.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="3"><name>upstream_c</name><version>0.1.0</version><description>Top of the REP-159 test chain: labels an XML summary from upstream_b. Part of the upstream distribution of the rep159-testing harness.</description><maintainer email="jrivero@honurobotics.com">Jose Luis Rivero</maintainer><license>Apache-2.0</license><buildtool_depend>cmake</buildtool_depend><depend>upstream_b</depend><build_depend>gtest</build_depend><test_depend>gtest</test_depend><export><build_type>cmake</build_type></export></package>'
source_repo_package_xmls: {}
type: cache
version: 2
