%YAML 1.1
# ROS distribution file
# see REP 141: https://reps.openrobotics.org/rep-0141/
---
release_platforms:
  ubuntu:
  - resolute
binary_rule:
  search: '^'
  replace: 'vendor-{DISTRO}-'
install_rule: '/opt/ros/{distro}'
repositories:
  ros_workspace:
    release:
      tags:
        release: release/upstream/{package}/{version}
      url: https://github.com/rep159-testing/ros_workspace-release.git
      version: 1.0.4-1
    source:
      type: git
      url: https://github.com/rep159-testing/ros_workspace.git
      version: main
  upstream_a:
    release:
      tags:
        release: release/upstream/{package}/{version}
      url: https://github.com/rep159-testing/upstream_a-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/upstream_a.git
      version: main
  upstream_b:
    release:
      tags:
        release: release/upstream/{package}/{version}
      url: https://github.com/rep159-testing/upstream_b-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/upstream_b.git
      version: main
  upstream_c:
    release:
      tags:
        release: release/upstream/{package}/{version}
      url: https://github.com/rep159-testing/upstream_c-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/upstream_c.git
      version: main
type: distribution
version: 3
