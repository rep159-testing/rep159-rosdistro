%YAML 1.1
# ROS distribution file
# see REP 141: https://reps.openrobotics.org/rep-0141/
---
extends:
- distro_name: composable
  extension_method: source_rebuild
  install_rule: '/opt/ros/{distro}'
  index_url:
release_platforms:
  ubuntu:
  - resolute
repositories:
  ros_workspace:
    release:
      tags:
        release: release/upstream/{package}/{version}
      url: https://github.com/rep159-testing/ros_workspace-release.git
      version: 1.0.3-2
    source:
      type: git
      url: https://github.com/rep159-testing/ros_workspace.git
      version: main
  downstream_src_a:
    release:
      tags:
        release: release/srcext/{package}/{version}
      url: https://github.com/rep159-testing/downstream_src_a-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/downstream_src_a.git
      version: main
type: distribution
version: 3
