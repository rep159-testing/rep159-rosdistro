%YAML 1.1
# Gazebo Jetty root distribution for REP-159 Stage 6 testing (extendablejetty).
# Uses workspace_package: ros_workspace_shell (plain CMake, zero Ament packages).
---
release_platforms:
  ubuntu:
  - resolute
install_rule: '/opt/ros/{distro}'
repositories:
  gz-cmake:
    release:
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/gz-cmake-release.git
      version: 5.1.1-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-cmake.git
      version: gz-cmake5_5.1.1
  gz-math:
    release:
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/gz-math-release.git
      version: 9.3.0-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-math.git
      version: gz-math9_9.3.0
  gz-msgs:
    release:
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/gz-msgs-release.git
      version: 12.0.2-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-msgs.git
      version: gz-msgs12_12.0.2
  gz-tools:
    release:
      packages:
      - gz-tools2
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/gz-tools-release.git
      version: 2.0.4-1
    source:
      type: git
      url: https://github.com/rep159-testing/gz-tools.git
      version: feat/rep159-jetty
  gz-transport:
    release:
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/gz-transport-release.git
      version: 15.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/gz-transport.git
      version: feat/rep159-jetty
  gz-utils:
    release:
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/gz-utils-release.git
      version: 4.0.0-1
    source:
      type: git
      url: https://github.com/gazebosim/gz-utils.git
      version: gz-utils4_4.0.0
  ros_workspace_shell:
    release:
      tags:
        release: release/extendablejetty/{package}/{version}
      url: https://github.com/rep159-testing/ros_workspace_shell-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/ros_workspace_shell.git
      version: main
type: distribution
version: 3
workspace_package: ros_workspace_shell
