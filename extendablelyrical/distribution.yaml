%YAML 1.1
# Child distribution extending [lyrical, extendablejetty] with binary_import (REP-159 multi-parent Gazebo extension).
# Uses standard ros_workspace to chain /opt/ros/lyrical and /opt/ros/extendablejetty
# into /opt/ros/extendablelyrical and builds vendorless ros_gz_bridge.
---
extends:
- distro_name: lyrical
  extension_method: binary_import
  install_rule: '/opt/ros/{distro}'
  index_url:
- distro_name: extendablejetty
  extension_method: binary_import
  install_rule: '/opt/ros/{distro}'
  index_url:
release_platforms:
  ubuntu:
  - resolute
install_rule: '/opt/ros/{distro}'
repositories:
  gz-demo-math:
    release:
      tags:
        release: release/extendablelyrical/{package}/{version}
      url: https://github.com/rep159-testing/gz-demo-math-release.git
      version: 1.0.1-1
    source:
      type: git
      url: https://github.com/j-rivero/gz-demo-math.git
      version: main
  ros_gz:
    release:
      packages:
      - ros_gz_bridge
      - ros_gz_interfaces
      tags:
        release: release/extendablelyrical/{package}/{version}
      url: https://github.com/rep159-testing/ros_gz-release.git
      version: 3.0.12-1
    source:
      type: git
      url: https://github.com/rep159-testing/ros_gz.git
      version: feat/rep159-no-vendor
  ros_workspace:
    release:
      tags:
        release: release/extendablelyrical/{package}/{version}
      url: https://github.com/rep159-testing/ros_workspace-release.git
      version: 1.0.4-1
    source:
      type: git
      url: https://github.com/rep159-testing/ros_workspace.git
      version: feat/rep159-parent-chaining
type: distribution
version: 3
