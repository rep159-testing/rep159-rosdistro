%YAML 1.1
# Child distribution extending extendablejetty with binary_import (REP-159 Stage 6).
# Uses workspace_package: ros_workspace_shell to chain /opt/ros/extendablejetty
# into /opt/ros/extendablelyrical with zero Ament dependencies.
---
extends:
- distro_name: extendablejetty
  extension_method: binary_import
  install_rule: '/opt/ros/{distro}'
  index_url:
release_platforms:
  ubuntu:
  - resolute
install_rule: '/opt/ros/{distro}'
repositories:
  gz-demo-math:
    release:
      tags:
        release: release/extendablelyrical/{package}/{version}
      url: https://github.com/rep159-testing/gz-demo-math-release.git
      version: 1.0.1-1
    source:
      type: git
      url: https://github.com/j-rivero/gz-demo-math.git
      version: main
  ros_workspace_shell:
    release:
      tags:
        release: release/extendablelyrical/{package}/{version}
      url: https://github.com/rep159-testing/ros_workspace_shell-release.git
      version: 0.1.0-1
    source:
      type: git
      url: https://github.com/rep159-testing/ros_workspace_shell.git
      version: main
type: distribution
version: 3
workspace_package: ros_workspace_shell
