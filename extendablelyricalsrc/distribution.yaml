%YAML 1.1
# Child distribution extending extendablejetty with source_rebuild (REP-159 Stage 6).
---
extends:
- distro_name: extendablejetty
  extension_method: source_rebuild
  install_rule: '/opt/ros/{distro}'
  index_url:
release_platforms:
  ubuntu:
  - resolute
install_rule: '/opt/ros/{distro}'
repositories:
  gz-demo-math:
    release:
      tags:
        release: release/extendablelyrical/{package}/{version}
      url: https://github.com/rep159-testing/gz-demo-math-release.git
      version: 1.0.1-1
    source:
      type: git
      url: https://github.com/j-rivero/gz-demo-math.git
      version: main
type: distribution
version: 3
workspace_package: ros_workspace_shell
