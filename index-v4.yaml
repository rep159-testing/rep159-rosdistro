%YAML 1.1
# REP 159 test harness: three distributions, none of them a ROS release.
#   upstream    a root distribution: upstream_a <- upstream_b <- upstream_c
#               plus ament_package <- ament_cmake_core <- ros_workspace
#   srcext      extends upstream with extension_method: source_rebuild
#   binext      extends upstream with extension_method: binary_import
#
# Isolated test harness:
#   extendable    isolated root distribution
#   extendablesrc extends extendable with source_rebuild
#   extendablebin extends extendable with binary_import
#
# distribution_type is ros2 everywhere because ros_buildfarm's ci_job.py
# accepts only ros1 or ros2; none of these distributions is a ROS release.
# Caches: tools/regenerate-caches.sh.
---
type: index
version: 4
distributions:
  upstream:
    distribution: [upstream/distribution.yaml]
    distribution_cache: upstream-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  srcext:
    distribution: [srcext/distribution.yaml]
    distribution_cache: srcext-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  binext:
    distribution: [binext/distribution.yaml]
    distribution_cache: binext-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  extendable:
    distribution: [extendable/distribution.yaml]
    distribution_cache: extendable-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  extendablesrc:
    distribution: [extendablesrc/distribution.yaml]
    distribution_cache: extendablesrc-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  extendablebin:
    distribution: [extendablebin/distribution.yaml]
    distribution_cache: extendablebin-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  extendablechain:
    distribution: [extendablechain/distribution.yaml]
    distribution_cache: extendablechain-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  extendablemixed:
    distribution: [extendablemixed/distribution.yaml]
    distribution_cache: extendablemixed-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  extendablediamond:
    distribution: [extendablediamond/distribution.yaml]
    distribution_cache: extendablediamond-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  composable:
    distribution: [composable/distribution.yaml]
    distribution_cache: composable-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  composablebin:
    distribution: [composablebin/distribution.yaml]
    distribution_cache: composablebin-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  composablesrc:
    distribution: [composablesrc/distribution.yaml]
    distribution_cache: composablesrc-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  composablechain:
    distribution: [composablechain/distribution.yaml]
    distribution_cache: composablechain-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  composablemixed:
    distribution: [composablemixed/distribution.yaml]
    distribution_cache: composablemixed-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3
  composablediamond:
    distribution: [composablediamond/distribution.yaml]
    distribution_cache: composablediamond-cache.yaml.gz
    distribution_status: active
    distribution_type: ros2
    python_version: 3


